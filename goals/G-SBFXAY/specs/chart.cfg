\* Chart config of place_set.tla: the check config place_set.cfg with
\* ExtraCauses empty, so TLC reaches 166 states, under the chart budget of
\* 500. place_set.cfg (646 states) checks every rule with all five causes.
SPECIFICATION Spec

CONSTANTS
    PartialPlace = FALSE
    FirstCauseOnly = FALSE
    AllowEmptyLine = FALSE
    DropMissing = FALSE
    RePlaceUnchanged = FALSE
    SpecsInSet = FALSE
    PerLineOffer = FALSE
    ExtraCauses = {}

INVARIANTS
    WholeSetOrNone
    PlacedSetAgrees
    NamesEveryCause
    NoEmptyLinePlaced
    NoExampleLeaves
    OnlyChangedSetPlaced
    OnePlaceLine
